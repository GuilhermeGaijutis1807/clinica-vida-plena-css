<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clínica Vida Plena - Agendamento</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>Clínica Vida Plena</h1>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="agendamento.html">Agendamento</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Agendamento de Consultas</h2>

        <form id="formulario-agendamento" action="#" method="post">
            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email">
            <br>

            <label for="telefone">Telefone:</label>
            <input type="tel" id="telefone" name="telefone" required inputmode="numeric" maxlength="15" pattern="(?:\(?[1-9]{2}\)?\s?)?(?:9\d{4}|\d{4})-?\d{4}" title="Formato de telefone inválido. Exemplo: 17 98765-4321 ou 17987654321">

            <label for="data">Data da Consulta:</label>
            <input type="date" id="data" name="data" required>
            <br>

            <label for="hora">Hora da Consulta:</label>
            <input type="time" id="hora" name="hora" required>
            <br>

            <label for="especialidade">Especialidade:</label>
            <select id="especialidade" name="especialidade" required>
                <option value="">Selecione uma especialidade</option>
                <option value="cardiologia">Cardiologia</option>
                <option value="clinico-geral">Clínico Geral</option>
                <option value="dermatologia">Dermatologia</option>
                <option value="pediatria">Pediatria</option>
            </select>

            <label for="mensagem">Mensagem:</label>
            <textarea id="mensagem" name="mensagem" rows="1"></textarea>

            <button type="submit">Agendar</button>
        </form>

    </main>

    <footer>
        <p>&copy; 2026 Clínica Vida Plena. Todos os direitos reservados.</p>
    </footer>
</body>

</html>
